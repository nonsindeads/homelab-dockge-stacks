
services:
  unbound:
    image: mvance/unbound:1.17.1
    container_name: unbound
    restart: unless-stopped
    volumes:
      - unbound_config:/opt/unbound/etc/unbound
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5335 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  pihole:
    image: pihole/pihole:2024.07.0
    container_name: pihole
    restart: unless-stopped
    depends_on:
      - unbound
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - DNS1=unbound#5335
      - DNS2=
      - FTLCONF_LOCAL_IPV4=${WG_BIND_IP}
    ports:
      - "${WG_BIND_IP}:${PIHOLE_UI_PORT}:80"
      - "${WG_BIND_IP}:53:53/tcp"
      - "${WG_BIND_IP}:53:53/udp"
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/admin/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pihole_etc:
  pihole_dnsmasq:
  unbound_config:
