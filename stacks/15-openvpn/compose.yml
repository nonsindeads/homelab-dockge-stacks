
services:
  openvpn:
    image: kylemanna/openvpn:${OPENVPN_IMAGE_TAG}
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${OPENVPN_BIND_IP}:${OPENVPN_PORT}:1194/udp"
    volumes:
      - openvpn_data:/etc/openvpn
    sysctls:
      - net.ipv4.ip_forward=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pidof openvpn >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  openvpn_data:
